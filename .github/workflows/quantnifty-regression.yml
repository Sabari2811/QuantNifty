name: QuantNifty Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INDSTOCKS_API_TOKEN: ci-test-token

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run regression suite
        shell: bash
        run: |
          set +e
          python -m pytest -q 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          echo "pytest_exit_code=${status}" >> pytest.log
          exit "${status}"

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quantnifty-regression-log
          path: pytest.log
          if-no-files-found: ignore
